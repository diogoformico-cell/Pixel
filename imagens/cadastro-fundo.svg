<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fundo futurista PixelNova com grade neon, pixels e formulário de cadastro">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset=".6" stop-color="#0c1230"/><stop offset="1" stop-color="#1a0d36"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#32e6ff"/><stop offset=".55" stop-color="#4f7bff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1261ff" stop-opacity=".45"/><stop offset="1" stop-color="#1261ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a855f7" stop-opacity=".4"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#32e6ff" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="1300" cy="180" r="420" fill="url(#g1)"/>
<circle cx="250" cy="720" r="460" fill="url(#g2)"/>
<!-- cartão de cadastro estilizado (esquerda) -->
<g transform="translate(120 190) rotate(-6)" opacity=".55">
<rect width="360" height="440" rx="22" fill="#101728" stroke="url(#neon)" stroke-width="2"/>
<circle cx="70" cy="75" r="32" fill="none" stroke="#32e6ff" stroke-width="3"/>
<circle cx="70" cy="66" r="10" fill="#32e6ff"/><path d="M48 96q22-26 44 0" fill="#32e6ff"/>
<rect x="125" y="58" width="180" height="14" rx="7" fill="#4f7bff" opacity=".8"/>
<rect x="125" y="84" width="120" height="10" rx="5" fill="#aab7d0" opacity=".4"/>
<g fill="none" stroke="#4f7bff" stroke-opacity=".7" stroke-width="2"><rect x="30" y="150" width="300" height="38" rx="9"/><rect x="30" y="206" width="140" height="38" rx="9"/><rect x="190" y="206" width="140" height="38" rx="9"/><rect x="30" y="262" width="300" height="38" rx="9"/><rect x="30" y="318" width="300" height="38" rx="9"/></g>
<rect x="30" y="380" width="300" height="36" rx="10" fill="url(#neon)"/>
</g>
<!-- pin de localização (direita) -->
<g transform="translate(1180 420)" opacity=".7">
<path d="M0 0c-70 0-120 52-120 116 0 90 120 190 120 190s120-100 120-190C120 52 70 0 0 0z" fill="none" stroke="url(#neon)" stroke-width="5"/>
<circle cx="0" cy="112" r="40" fill="none" stroke="#32e6ff" stroke-width="5"/>
<circle cx="0" cy="112" r="14" fill="#32e6ff"/>
</g>
<g fill="none" stroke="#32e6ff" stroke-opacity=".35" stroke-width="2"><ellipse cx="1180" cy="745" rx="150" ry="34"/><ellipse cx="1180" cy="745" rx="230" ry="54"/><ellipse cx="1180" cy="745" rx="320" ry="76"/></g>
<!-- pixels flutuantes -->
<g>
<rect x="640" y="120" width="26" height="26" fill="#32e6ff" opacity=".8"/><rect x="690" y="165" width="18" height="18" fill="#a855f7" opacity=".8"/><rect x="610" y="190" width="14" height="14" fill="#4f7bff" opacity=".8"/>
<rect x="900" y="700" width="22" height="22" fill="#a855f7" opacity=".7"/><rect x="950" y="750" width="14" height="14" fill="#32e6ff" opacity=".8"/><rect x="860" y="760" width="30" height="30" fill="#4f7bff" opacity=".6"/>
<rect x="1450" y="60" width="16" height="16" fill="#32e6ff" opacity=".7"/><rect x="60" y="80" width="20" height="20" fill="#a855f7" opacity=".7"/><rect x="520" y="800" width="16" height="16" fill="#32e6ff" opacity=".6"/>
</g>
<!-- estrela -->
<g transform="translate(1440 700)" opacity=".6"><path d="M0-46 8-8 46 0 8 8 0 46-8 8-46 0-8-8z" fill="#32e6ff"/></g>
<g transform="translate(300 100)" opacity=".5"><path d="M0-28 5-5 28 0 5 5 0 28-5 5-28 0-5-5z" fill="#a855f7"/></g>
</svg>
